<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Viewer with Chat Interface</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
            background-color: #edf5e1; /* Earth green background */
        }

        #pdf-container {
            width: 66%;
            height: 100%;
            background-color: #f8f9fa; /* Light gray for contrast */
            overflow: auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #pdf-viewer {
            width: 90%;
            height: 90%;
        }

        canvas {
            width: 100%;
            height: 100%;
            border: 1px solid #c0c0c0; /* Subtle border */
        }

        #chat-container {
            width: 34%;
            height: 100%;
            background-color: #d4e157; /* Earth green tones */
            display: flex;
            flex-direction: column;
            border-left: 2px solid #81c784; /* Accent green for divider */
        }

        #chat-header {
            padding: 10px;
            background-color: #8bc34a;
            color: #fff;
            text-align: center;
            font-weight: bold;
            border-bottom: 2px solid #558b2f;
        }

        #chat-messages {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
            background-color: #f0f4c3;
        }

        #chat-input {
            display: flex;
            border-top: 2px solid #558b2f;
        }

        #chat-input textarea {
            flex: 1;
            border: none;
            padding: 10px;
            font-size: 14px;
            resize: none;
        }

        #chat-input button {
            background-color: #388e3c;
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
        }

        #chat-input button:hover {
            background-color: #2e7d32;
        }
    </style>
</head>
<body>
    <div id="pdf-container">
        <div id="pdf-viewer"></div>
    </div>
    <div id="chat-container">
        <div id="chat-header">Chat Interface</div>
        <div id="chat-messages"></div>
        <div id="chat-input">
            <textarea placeholder="Type your message here..." rows="3"></textarea>
            <button>Send</button>
        </div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

        const url = "{{ pdf_url }}"; // Django will provide this variable
        const container = document.getElementById('pdf-viewer');

        async function loadPDF() {
            try {
                console.log("PDF URL:", url);
                const loadingTask = pdfjsLib.getDocument(url);
                const pdfDoc = await loadingTask.promise;

                const page = await pdfDoc.getPage(1);
                const viewport = page.getViewport({ scale: 1.5 });

                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                canvas.width = viewport.width;
                canvas.height = viewport.height;

                container.appendChild(canvas);

                const renderContext = {
                    canvasContext: context,
                    viewport: viewport
                };

                await page.render(renderContext);
            } catch (error) {
                console.error("Detailed PDF Loading Error:", error);
                container.innerHTML = `<p>PDF Load Error: ${error.message}</p>`;
            }
        }

        loadPDF();
    </script>
</body>
</html>
