<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Viewer with AI Chatbot</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
            background-color: #f4f4f4;
        }

        #pdf-container {
            width: 66%;
            height: 100%;
            background: linear-gradient(135deg, #2c3e50, #4ca1af);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #pdf-viewer {
            width: 90%;
            height: 85%;
        }

        canvas {
            width: 100%;
            height: 100%;
            border: 1px solid #c0c0c0;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        #page-navigation {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 10px;
        }

        #page-navigation button {
            margin: 0 10px;
            padding: 5px 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        #page-navigation button:disabled {
            background-color: #c8e6c9;
            cursor: not-allowed;
        }

        #page-navigation button:hover:not(:disabled) {
            background-color: #388e3c;
        }

        #page-number {
            margin: 0 10px;
            font-size: 1em;
            color: #ffffff;
        }

        #ai-chat-container {
            width: 34%;
            height: 100%;
            background-color: #f0f0f0;
            display: flex;
            flex-direction: column;
            border-left: 2px solid #4CAF50;
        }

        .chat-header {
            padding: 15px;
            background-color: #4CAF50;
            color: white;
            font-size: 1.2em;
            font-weight: bold;
            text-align: center;
            border-bottom: 2px solid #388e3c;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            background-color: #ffffff;
        }

        .chat-input-container {
            display: flex;
            padding: 10px;
            background-color: #f0f0f0;
            border-top: 1px solid #ddd;
        }

        #chat-input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin-right: 10px;
        }

        #send-btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 10px 15px;
            cursor: pointer;
        }

        .message {
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 4px;
            max-width: 80%;
        }

        .user-message {
            background-color: #e1f5fe;
            align-self: flex-end;
            margin-left: auto;
        }

        .ai-message {
            background-color: #f0f4c3;
            align-self: flex-start;
        }

        /* Timer Display Styles */
        .timer-display {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.2);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 1.1rem;
            z-index: 100;
        }

        .warning .timer-display {
            background: rgba(220, 53, 69, 0.8);
            animation: pulse 1s infinite;
        }

        .warning-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(220, 53, 69, 0.95);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            text-align: center;
            animation: fadeIn 0.3s ease-in;
        }

        .warning-modal h2 {
            color: white;
            margin-bottom: 10px;
        }

        .warning-modal p {
            color: white;
            margin-bottom: 0;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>  
    <div id="pdf-container">
        <div id="pdf-viewer"></div>
        <div id="page-navigation">
            <button id="prev-page" disabled>Previous</button>
            <span id="page-number">Page 1</span>
            <button id="next-page">Next</button>
        </div>
    </div>

    <div id="ai-chat-container">
        <div class="chat-header">AI Assistant</div>
        <div id="chat-messages" class="chat-messages"></div>
        <div class="chat-input-container">
            <input type="text" id="chat-input" placeholder="Ask a question about the document...">
            <button id="send-btn">Send</button>
        </div>
    </div>

    <!-- Timer Display -->
    <div class="timer-display" id="timerDisplay">
        Time remaining: <span id="mainTimer">10</span>s
    </div>

    <!-- Warning Modal -->
    <div class="modal-overlay" id="modalOverlay"></div>
    <div class="warning-modal" id="warningModal">
        <h2>⚠️ Warning</h2>
        <p>This page will redirect in <span id="countdown">5</span> seconds</p>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

        // PDF Viewer Logic
        const url = "{{ pdf_url }}"; // Replace with actual PDF URL
        const container = document.getElementById('pdf-viewer');
        const prevPageBtn = document.getElementById('prev-page');
        const nextPageBtn = document.getElementById('next-page');
        const pageNumberSpan = document.getElementById('page-number');

        let pdfDoc = null;
        let pageNum = 1;
        let pageRendering = false;
        let pageNumPending = null;

        function renderPage(num) {
            pageRendering = true;
            container.innerHTML = '';

            pdfDoc.getPage(num).then(function(page) {
                const viewport = page.getViewport({ scale: 1.5 });

                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                canvas.width = viewport.width;
                canvas.height = viewport.height;

                container.appendChild(canvas);

                const renderContext = {
                    canvasContext: context,
                    viewport: viewport
                };

                const renderTask = page.render(renderContext);
                renderTask.promise.then(function() {
                    pageRendering = false;
                    if (pageNumPending !== null) {
                        renderPage(pageNumPending);
                        pageNumPending = null;
                    }
                });
            });

            pageNumberSpan.textContent = `Page ${num}`;
            prevPageBtn.disabled = (num <= 1);
            nextPageBtn.disabled = (num >= pdfDoc.numPages);
        }

        function queueRenderPage(num) {
            if (pageRendering) {
                pageNumPending = num;
            } else {
                renderPage(num);
            }
        }

        function onPrevPage() {
            if (pageNum <= 1) return;
            pageNum--;
            queueRenderPage(pageNum);
        }

        function onNextPage() {
            if (pageNum >= pdfDoc.numPages) return;
            pageNum++;
            queueRenderPage(pageNum);
        }

        async function loadPDF() {
            try {
                const loadingTask = pdfjsLib.getDocument(url);
                pdfDoc = await loadingTask.promise;

                nextPageBtn.disabled = (pdfDoc.numPages <= 1);
                prevPageBtn.disabled = true;

                renderPage(1);

                prevPageBtn.addEventListener('click', onPrevPage);
                nextPageBtn.addEventListener('click', onNextPage);
            } catch (error) {
                console.error("Error loading PDF:", error);
                container.innerHTML = `<p>PDF Load Error: ${error.message}</p>`;
            }
        }

        loadPDF();

        // AI Chat Logic
        const chatMessages = document.getElementById('chat-messages');
        const chatInput = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-btn');

        function addMessage(content, sender) {
            const messageElement = document.createElement('div');
            messageElement.classList.add('message', `${sender}-message`);
            messageElement.textContent = content;
            chatMessages.appendChild(messageElement);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        async function sendMessage() {
            const message = chatInput.value.trim();
            if (!message) return;

            // Add user message
            addMessage(message, 'user');
            chatInput.value = '';

            // Simulate AI response (replace with actual Azure AI API call)
            try {
                const response = await fetch('https://your-azure-openai-endpoint.com/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'api-key': 'AAkPteb7vgA5SaH0dmZxEVyPWAFPpdnwVxy6MkxLq5sBAmrDBna7JQQJ99AKACHYHv6XJ3w3AAAAACOGmi4S'
                    },
                    body: JSON.stringify({
                        messages: [{ role: 'user', content: message }],
                        max_tokens: 150
                    })
                });

                const data = await response.json();
                const aiResponse = data.choices[0].message.content;
                addMessage(aiResponse, 'ai');
            } catch (error) {
                addMessage('Sorry, I could not process your request.', 'ai');
                console.error('Chat API Error:', error);
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // Timer and Warning Modal Logic
        const warningModal = document.getElementById('warningModal');
        const modalOverlay = document.getElementById('modalOverlay');
        const countdownElement = document.getElementById('countdown');
        const mainTimerElement = document.getElementById('mainTimer');
        const timerDisplay = document.getElementById('timerDisplay');

        // Start main countdown immediately
        let mainTimeLeft = 10;
        const mainTimerInterval = setInterval(() => {
            mainTimeLeft--;
            mainTimerElement.textContent = mainTimeLeft;
            
            // Show warning at 5 seconds
            if (mainTimeLeft === 5) {
                warningModal.style.display = 'block';
                modalOverlay.style.display = 'block';
                timerDisplay.classList.add('warning');
                
                // Start warning countdown
                let warningTimeLeft = 5;
                const warningInterval = setInterval(() => {
                    warningTimeLeft--;
                    countdownElement.textContent = warningTimeLeft;
                    
                    if (warningTimeLeft <= 0) {
                        clearInterval(warningInterval);
                        clearInterval(mainTimerInterval);
                        // Redirect after countdown
                        window.location.href = '/redirect-page';
                    }
                }, 1000);
            }
        }, 1000);
    </script>
</body>
</html>
