<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to NoteBox</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #2c3e50, #4ca1af); /* Earth Tones Gradient */
            color: #fff;
            font-family: 'Arial', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: none;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        .card-header h3 {
            font-weight: bold;
            color: #fff;
        }
        .form-control {
            background: rgb(255, 255, 255);
            border: none;
            color: #000000;
        }
        .form-control:focus {
            box-shadow: none;
        }
        .btn-primary {
            background: #16a085; /* Forest Green */
            border: none;
            transition: all 0.3s;
        }
        .btn-primary:hover {
            background: #12897d; /* Darker Forest Green */
        }
        .alert {
            background: rgba(255, 255, 255, 0.2);
            border: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card p-4">
                    <div class="card-header text-center mb-3">
                        <h3>Welcome to NoteBox</h3>
                    </div>
                    <div class="card-body">
                        <form method="post">
                            {% csrf_token %}
                            {% if form.errors %}
                                <div class="alert alert-danger text-center">
                                    Invalid username or password. Please try again.
                                </div>
                            {% endif %}
                            {{ form.as_p }}
                            <div class="d-grid mt-4">
                                <button type="submit" class="btn btn-primary btn-lg">Login</button>
                            </div>
                        </form>
                        <div class="text-center mt-3">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
