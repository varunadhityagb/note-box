<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NoteBox</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #2c3e50, #4ca1af); /* Earth Tones Background */
      color: #fff;
      font-family: 'Arial', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background-color: rgba(0, 0, 0, 0.6);
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
    }
    header h1 {
      font-size: 1.8rem;
      margin: 0;
    }
    .profile-container {
      position: relative;
    }
    #profile-icon {
      background: #16a085; /* Forest Green */
      border: none;
      padding: 8px 12px;
      font-size: 1.2rem;
      color: #fff;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.3s;
    }
    #profile-icon:hover {
      background: #12897d; /* Darker Green */
    }
    #menu {
      position: absolute;
      top: 40px;
      right: 0;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 5px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
      padding: 10px 0;
    }
    #menu ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    #menu ul li a {
      color: #fff;
      text-decoration: none;
      padding: 8px 15px;
      display: block;
      transition: background 0.3s;
    }
    #menu ul li a:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    .hidden {
      display: none;
    }
    main {
      flex: 1;
      padding: 30px 20px;
    }
    .classes h2 {
      margin-bottom: 20px;
    }
    .class-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 20px;
    }
    .class-item {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      font-size: 1.2rem;
      font-weight: bold;
      color: #fff;
      transition: transform 0.3s, box-shadow 0.3s;
    }
    .class-item:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
    }
  </style>
</head>
<body>
  <header>
    <h1>NoteBox</h1>
    <div class="profile-container">
      <button id="profile-icon">👤</button>
      <div id="menu" class="hidden" style="z-index: 1;">
        <ul>
          <!-- <li><a href="#">Profile</a></li>
          <li><a href="#">Settings</a></li> -->
        <li><form method="post" action="{% url 'core:logout' %}" id="logout-form">
            {% csrf_token %}
            <a onclick="handleLogout(event)">Logout</a>
        </form></li>
        </ul>
      </div>
    </div>
  </header>
  <main>
    <div class="classes">
      <h2>Classes</h2>
      <div class="class-grid">
        <div class="class-item">Class 1</div>
        <div class="class-item">Class 2</div>
        <div class="class-item">Class 3</div>
        <div class="class-item">Class 4</div>
      </div>
    </div>
  </main>
  <script>
    // Toggle Profile Menu
    const profileIcon = document.getElementById('profile-icon');
    const menu = document.getElementById('menu');

    profileIcon.addEventListener('click', () => {
      menu.classList.toggle('hidden');
    });

    // Hide menu when clicking outside
    document.addEventListener('click', (e) => {
      if (!profileIcon.contains(e.target) && !menu.contains(e.target)) {
        menu.classList.add('hidden');
      }
    });

    function handleLogout(event) {
            event.preventDefault();
            document.getElementById('logout-form').submit();
            // Clear any client-side storage if you're using any
            localStorage.clear();
            sessionStorage.clear();
        };
  </script>
</body>
</html>
